services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_service
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./back
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/auto_service
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Фронтенд: сборка статики и раздача через nginx (SPA-роутинг на :3000)
  front:
    build: ./front
    ports:
      - "3000:80"
    depends_on:
      - back

volumes:
  pgdata:
